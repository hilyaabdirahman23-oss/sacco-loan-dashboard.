<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SACCO Loan Dashboard</title>
<style>
:root{--bg:#fff;--side:#f0f2f6;--tx:#262730;--mut:#6b6f7b;--tile:#e3f0fc;--tt:#0b6a8c;--ok:#cdeed6;--okt:#1b7a3d;--bad:#fadbd8;--badt:#a93226;--ac:#ff2b6d;--bd:#d9dce3;--bar:#7fbf8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--side:#1a1d26;--tx:#e8e9ee;--mut:#9a9eab;--tile:#16324a;--tt:#8fd3ef;--ok:#16402a;--okt:#8fe0aa;--bad:#4a1f1b;--badt:#ffb4aa;--bd:#2d313c;--bar:#4f9a5f}}
:root[data-theme="dark"]{--bg:#0e1117;--side:#1a1d26;--tx:#e8e9ee;--mut:#9a9eab;--tile:#16324a;--tt:#8fd3ef;--ok:#16402a;--okt:#8fe0aa;--bad:#4a1f1b;--badt:#ffb4aa;--bd:#2d313c;--bar:#4f9a5f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Source Sans Pro",Arial,sans-serif}
.app{display:flex;min-height:100vh}.side{width:290px;background:var(--side);padding:20px 16px;flex-shrink:0}.main{flex:1;padding:24px 28px;max-width:1000px;min-width:0}
@media(max-width:760px){.app{flex-direction:column}.side{width:100%}.main{padding:16px}}
h3{margin:18px 0 8px;font-size:1.25rem}.sec{font-weight:700;margin:26px 0 10px}.title{font-size:2rem;font-weight:800;margin:0}.mut{color:var(--mut);font-size:.9rem}
.head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=number],input[type=password]{width:100%;padding:9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font-size:1rem}
label{display:block;font-size:.85rem;margin:10px 0 4px}button{padding:8px 14px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);cursor:pointer;font-size:.95rem}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}.nav button{display:block;width:100%;text-align:left;margin:3px 0;border:0;background:none}.nav button.on{font-weight:700;color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
.tl{margin-bottom:6px}.tile{background:var(--tile);color:var(--tt);border-radius:6px;padding:15px 16px;font-family:"Source Code Pro",monospace;overflow:hidden}
input[type=range]{width:100%;accent-color:var(--ac)}.sv{color:var(--ac);font-family:monospace;font-size:.85rem}
.box{border-radius:6px;padding:15px 16px}.ok{background:var(--ok);color:var(--okt)}.bad{background:var(--bad);color:var(--badt)}
.row{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start}@media(max-width:760px){.row{grid-template-columns:1fr}}
.warn{background:#fff3cd;color:#664d03;padding:10px;border-radius:6px;margin:8px 0}.err{background:var(--bad);color:var(--badt);padding:10px;border-radius:6px;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:.9rem;display:block;overflow-x:auto}td,th{border-bottom:1px solid var(--bd);padding:7px 10px;text-align:left;white-space:nowrap}
.met{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.met div{background:var(--side);border-radius:8px;padding:14px}.met b{font-size:1.8rem;display:block}
</style></head><body><div id="root"></div>
<script>
const DATA={"M":{"mean":[56571.1875,310826.75,21.78,14334.4,171397.1875,20060.039931,0.607403,3.04894],"scale":[34271.315281,252429.465018,11.961463,12985.804871,150300.238808,23485.420327,0.332654,1.663117],"coef":[0.066678,0.17385,-0.119981,0.065768,-0.217186,-0.1189,0.660601,-0.188703,0.120336,-0.419308,-0.165233,0.465159,-0.078006,0.082838,-0.871151,0.867273],"b":0.263351,"emp":["Casual","Employed","Self-employed","Unemployed"],"hist":["Fair","First-time","Good","Poor"]},"H":{"monthly_income":{"hi":165374,"all":[52,186,260,302,267,256,182,147,109,57,43,24,20,19,31],"def":[19,52,74,61,58,55,36,39,10,11,12,7,0,7,5],"non":[33,134,186,241,209,201,146,108,99,46,31,17,20,12,26]},"loan_amount":{"hi":1213989,"all":[265,382,333,270,193,146,119,95,51,50,31,17,12,9,27],"def":[57,86,72,51,51,29,29,22,11,14,5,7,4,5,7],"non":[208,296,261,219,142,117,90,73,40,36,26,10,8,4,20]},"repayment_months":{"hi":48,"all":[0,202,0,508,0,393,0,426,0,0,0,291,0,0,180],"def":[0,94,0,134,0,74,0,81,0,0,0,44,0,0,23],"non":[0,108,0,374,0,319,0,345,0,0,0,247,0,0,157]},"existing_obligations":{"hi":60894,"all":[426,340,299,248,189,146,102,60,69,44,19,12,14,10,22],"def":[79,81,75,54,38,35,22,14,20,12,7,3,2,3,5],"non":[347,259,224,194,151,111,80,46,49,32,12,9,12,7,17]},"savings":{"hi":713009,"all":[392,346,288,222,186,146,87,84,63,36,20,13,18,12,27],"def":[113,102,66,41,39,18,19,13,5,6,4,0,1,0,6],"non":[279,244,222,181,147,128,68,71,58,30,16,13,17,12,21]}}};const M=DATA.M,H=DATA.H;
// BEGIN-MODEL  (weights exported from the trained scikit-learn Logistic Regression pipeline)
function predictP(d){const mr=d.loan/d.months,dti=(mr+d.obl)/d.inc,sti=d.sav/d.inc;
const x=[d.inc,d.loan,d.months,d.obl,d.sav,mr,dti,sti];let z=M.b;
for(let i=0;i<8;i++)z+=M.coef[i]*(x[i]-M.mean[i])/M.scale[i];
M.emp.forEach((e,i)=>{if(e===d.emp)z+=M.coef[8+i]});M.hist.forEach((h,i)=>{if(h===d.hist)z+=M.coef[12+i]});
return 1/(1+Math.exp(-z))}
// END-MODEL
const NOTICE="Decision support only. The model was trained on SYNTHETIC data. The result does not guarantee repayment or default and must be reviewed by a loan officer.";
let mem=null;const KEY="sacco_demo_v1";
const seed=[["M001","Employed",85000,180000,12,4000,120000,"Good"],["M002","Casual",24000,150000,12,6000,5000,"Poor"],["M003","Self-employed",52000,300000,24,8000,40000,"First-time"]];
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}
if(mem)return mem;const L=seed.map((r,i)=>mk(i+1,r));mem={loans:L};save(mem);return mem}
function mk(id,r){const d={id,member:r[0],emp:r[1],inc:r[2],loan:r[3],months:r[4],obl:r[5],sav:r[6],hist:r[7],decision:""};d.p=predictP(d);return d}
function save(db){mem=db;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
let db=load(),page="dash",user=null,sel=1;
const $=s=>document.querySelector(s),money=n=>Number(n).toLocaleString("en-KE");
function validate(d){const e=[],w=[];if(!d.member||!d.member.trim())e.push("Member number is required.");
if(!(d.inc>0))e.push("Monthly income must be greater than 0.");if(!(d.loan>0))e.push("Loan amount must be greater than 0.");
if(!(d.months>=1&&d.months<=120&&Number.isInteger(d.months)))e.push("Repayment period must be a whole number from 1 to 120 months.");
if(!(d.obl>=0))e.push("Existing obligations must be 0 or more.");if(!(d.sav>=0))e.push("Savings must be 0 or more.");
if(!e.length&&d.loan/d.inc>12)w.push("Loan is more than 12× monthly income, above the range the model learned from. Treat this prediction with extra caution.");return[e,w]}
const head=()=>`<div class="head"><svg width="130" height="95" viewBox="0 0 150 110" role="img" aria-label="House and coin"><rect x="30" y="50" width="70" height="48" fill="#fff" stroke="#ccc"/><polygon points="22,52 65,14 108,52" fill="#ff6f61"/><rect x="55" y="68" width="20" height="30" fill="#ffd9d4"/><ellipse cx="22" cy="40" rx="10" ry="14" fill="#ff7a5c"/><circle cx="108" cy="82" r="18" fill="#1f2a44"/><text x="108" y="89" font-size="20" fill="#ff6f61" text-anchor="middle" font-weight="bold">$</text></svg><div><p class="title">SACCO Loan Dashboard</p><div>Loan Default Risk Prediction</div></div></div>`;
function login(){$("#root").innerHTML=`<div class="main" style="margin:auto">${head()}<h3>Log in</h3><div style="max-width:320px"><label>Username</label><input id="u" type="text" autocapitalize="none" autocomplete="off"><label>Password</label><input id="pw" type="password" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()"><p id="le"></p><button class="p" onclick="doLogin()">Log in</button><p class="mut">Demo login: admin / Admin@12345. This browser preview keeps data in your own browser only.</p></div></div>`}
function doLogin(){if($("#u").value.trim().toLowerCase()==="admin"&&$("#pw").value.trim()==="Admin@12345"){user="admin";render()}else $("#le").innerHTML='<span class="err">Wrong username or password.</span>'}
function shell(side,body){const nav=[["dash","Client Dashboard"],["over","Overview"],["new","New application"],["rec","Loan records"]].map(([k,t])=>`<button class="${page===k?"on":""}" onclick="page='${k}';render()">${t}</button>`).join("");
$("#root").innerHTML=`<div class="app"><div class="side"><div class="mut">Logged in as <b>${user}</b></div><div class="nav" style="margin:10px 0">${nav}<button onclick="user=null;render()">Log out</button></div><hr style="border:0;border-top:1px solid var(--bd)">${side}</div><div class="main">${head()}${body}</div></div>`}
function render(){if(!user)return login();({dash,over,new:newApp,rec:records})[page]()}
const sl=(id,lab,v,max,step)=>`<div><div class="tl">${lab}</div><div class="sv" id="${id}v">${money(v)}</div><input type="range" id="${id}" min="${id==="inc"?1000:0}" max="${max}" step="${step}" value="${v}" oninput="upd()"></div>`;
function dash(){const L=db.loans;if(!L.find(l=>l.id===sel))sel=L[0]&&L[0].id;const r=L.find(l=>l.id===sel);
const opts=L.map(l=>`<option value="${l.id}" ${l.id===sel?"selected":""}>${l.member} (loan #${l.id})</option>`).join("");
const side=`<h3>Client Selection</h3><label>Select a client</label><select onchange="sel=+this.value;render()">${opts}</select><button style="margin-top:8px" onclick="render()">Reset</button><h3>Statistics</h3><label>Compare client to</label><select id="grp" onchange="hist()"><option value="all">All clients</option><option value="def">Defaulters</option><option value="non">Non-defaulters</option></select><label>Select parameter</label><select id="par" onchange="hist()"><option value="monthly_income">Monthly income</option><option value="loan_amount">Loan amount</option><option value="repayment_months">Repayment months</option><option value="existing_obligations">Existing obligations</option><option value="savings">Savings</option></select><div id="hist"></div><p class="mut">Comparison uses SYNTHETIC training data. Red line = this client.</p>`;
if(!r)return shell("","<p>No clients yet. Add one in New application.</p>");
const mx=k=>Math.ceil(Math.max(k,0)*1.5/1000+300)*1000;
shell(side,`<div class="sec">Client Details</div><div class="grid"><div><div class="tl">Employment Status</div><div class="tile">${r.emp}</div></div><div><div class="tl">Previous History</div><div class="tile">${r.hist}</div></div><div><div class="tl">Repayment Months</div><div class="tile">${r.months}</div></div><div><div class="tl">Member No</div><div class="tile">${r.member}</div></div></div><div class="grid" style="margin-top:18px">${sl("inc","Monthly Income",r.inc,mx(r.inc),1000)}${sl("loan","Loan Amount",r.loan,mx(r.loan*1.6),1000)}${sl("obl","Existing Obligations",r.obl,mx(r.obl*2),500)}${sl("sav","Savings",r.sav,mx(r.sav),1000)}</div><div class="sec">Scoring</div><div class="row"><div><div id="score"></div></div><div><div class="tl">Threshold</div><div class="sv" id="thv">0.50</div><input type="range" id="th" min="0" max="1" step="0.01" value="0.5" oninput="upd()"></div></div><p id="risk"></p><div id="wr"></div><p class="mut">${NOTICE}</p><div class="sec">Save</div><div class="row"><div><button class="p" onclick="saveDash()">Save values and this prediction</button><span id="sm" class="mut"></span></div><div><label>Officer’s final decision</label><select id="dec">${["","Approved","Rejected","Referred"].map(o=>`<option ${o===r.decision?"selected":""}>${o}</option>`).join("")}</select><button style="margin-top:8px" onclick="saveDec()">Save decision</button></div></div>`);upd();hist()}
function cur(){const r=db.loans.find(l=>l.id===sel);return{...r,inc:+$("#inc").value,loan:+$("#loan").value,obl:+$("#obl").value,sav:+$("#sav").value}}
function upd(){const d=cur(),t=+$("#th").value;["inc","loan","obl","sav"].forEach(k=>$("#"+k+"v").textContent=money(d[k]));$("#thv").textContent=t.toFixed(2);
const[e,w]=validate(d);if(e.length){$("#score").innerHTML=e.map(x=>`<div class="err">${x}</div>`).join("");$("#risk").textContent="";$("#wr").innerHTML="";return}
const p=predictP(d);$("#score").innerHTML=p>=t?'<div class="box bad">HIGH RISK: PREDICTED DEFAULT</div>':'<div class="box ok">LOW RISK: PREDICTED NON-DEFAULT</div>';
$("#risk").textContent="Default Risk : "+Math.round(p*100)+" %";$("#wr").innerHTML=w.map(x=>`<div class="warn">${x}</div>`).join("");hist()}
function hist(){const el=$("#hist");if(!el||!$("#par"))return;const par=$("#par").value,g=H[par],c=g[$("#grp").value],mxc=Math.max(...c),d=cur();
const key={monthly_income:"inc",loan_amount:"loan",repayment_months:"months",existing_obligations:"obl",savings:"sav"}[par],v=Math.min(d[key],g.hi),W=260,Hh=130,bw=W/c.length;
el.innerHTML=`<svg viewBox="0 0 ${W} ${Hh+22}" width="100%" role="img" aria-label="Histogram">${c.map((n,i)=>`<rect x="${i*bw+1}" y="${Hh-n/mxc*Hh}" width="${bw-2}" height="${n/mxc*Hh}" fill="var(--bar)" opacity=".7"/>`).join("")}<line x1="${v/g.hi*W}" x2="${v/g.hi*W}" y1="0" y2="${Hh}" stroke="#ff6f61" stroke-width="2"/><text x="0" y="${Hh+15}" font-size="10" fill="var(--mut)">0</text><text x="${W}" y="${Hh+15}" font-size="10" text-anchor="end" fill="var(--mut)">${money(g.hi)}</text></svg>`}
function saveDash(){const d=cur(),[e]=validate(d);if(e.length)return;Object.assign(db.loans.find(l=>l.id===sel),{inc:d.inc,loan:d.loan,obl:d.obl,sav:d.sav,p:predictP(d)});save(db);$("#sm").textContent=" Saved."}
function saveDec(){db.loans.find(l=>l.id===sel).decision=$("#dec").value;save(db);$("#sm").textContent=" Decision saved."}
function over(){const L=db.loans,t=.5,df=L.filter(l=>l.p>=t).length;shell("",`<div class="sec">Overview</div><div class="met"><div><b>${L.length}</b>Total loan applications</div><div><b>${df}</b>Predicted defaulters</div><div><b>${L.length-df}</b>Predicted non-defaulters</div></div><div class="sec">Applications</div>${tbl(L)}`)}
function tbl(L){return`<table><tr><th>Loan</th><th>Member</th><th>Employment</th><th>Income</th><th>Loan amount</th><th>Class</th><th>Default prob.</th><th>Officer decision</th></tr>${L.map(l=>`<tr><td>#${l.id}</td><td>${l.member}</td><td>${l.emp}</td><td>${money(l.inc)}</td><td>${money(l.loan)}</td><td>${l.p>=.5?"Default":"Non-default"}</td><td>${(l.p*100).toFixed(1)}%</td><td>${l.decision||"-"}</td></tr>`).join("")}</table>`}
function newApp(){const o=a=>a.map(x=>`<option>${x}</option>`).join("");shell("",`<div class="sec">New application and prediction</div><div style="max-width:520px"><label>Applicant member number</label><input id="m" type="text"><label>Employment status</label><select id="e">${o(M.emp)}</select><label>Monthly income (KES)</label><input id="i" type="number" min="0" value="0"><label>Loan amount (KES)</label><input id="l" type="number" min="0" value="0"><label>Repayment period (months)</label><input id="mo" type="number" value="12"><label>Existing monthly obligations (KES)</label><input id="ob" type="number" min="0" value="0"><label>Savings (KES)</label><input id="s" type="number" min="0" value="0"><label>Previous repayment history</label><select id="h">${o(M.hist)}</select><p><button class="p" onclick="addApp()">Predict default risk</button></p><div id="res"></div></div>`)}
function addApp(){const d={member:$("#m").value.trim(),emp:$("#e").value,inc:+$("#i").value,loan:+$("#l").value,months:+$("#mo").value,obl:+$("#ob").value,sav:+$("#s").value,hist:$("#h").value,decision:""};
const[e,w]=validate(d);if(e.length){$("#res").innerHTML=e.map(x=>`<div class="err">${x}</div>`).join("");return}
d.id=Math.max(0,...db.loans.map(l=>l.id))+1;d.p=predictP(d);db.loans.push(d);save(db);sel=d.id;
$("#res").innerHTML=`<div class="box ${d.p>=.5?"bad":"ok"}">Loan #${d.id}: predicted ${d.p>=.5?"DEFAULT":"NON-DEFAULT"} (default probability ${(d.p*100).toFixed(1)}%)</div>${w.map(x=>`<div class="warn">${x}</div>`).join("")}<p class="mut">${NOTICE}</p>`}
function records(){shell("",`<div class="sec">Loan records</div><label>Search by member number</label><input type="text" id="q" oninput="rs()" style="max-width:300px"><div id="rt" style="margin-top:12px">${tbl(db.loans)}</div>`)}
function rs(){const q=$("#q").value.toLowerCase();$("#rt").innerHTML=tbl(db.loans.filter(l=>l.member.toLowerCase().includes(q)))}
render();
</script></body></html>
